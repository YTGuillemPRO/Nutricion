<!DOCTYPE html>
<html lang="ca">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Activitats Cost Ambiental — Faig 2</title>
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800;900&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/iconify-icon@1.0.7/dist/iconify-icon.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.5.1/dist/confetti.browser.min.js"></script>
<style>
:root{--bg:#050810;--card-bg:rgba(255,255,255,.04);--card-border:rgba(255,255,255,.06);--text-primary:#fff;--text-secondary:rgba(255,255,255,.82);--text-muted:rgba(255,255,255,.5);--green:#059669;--green-light:#10b981;--green-bg:rgba(5,150,105,.1);--green-border:rgba(5,150,105,.25);--rose:#e11d48;--rose-light:#f43f5e;--rose-bg:rgba(225,29,72,.1);--rose-border:rgba(225,29,72,.25);--amber:#d97706;--amber-light:#f59e0b;--amber-bg:rgba(217,119,6,.1);--amber-border:rgba(217,119,6,.25)}
*{margin:0;padding:0;box-sizing:border-box;font-family:'Plus Jakarta Sans',sans-serif}
body{min-height:100vh;background:var(--bg);color:var(--text-primary);padding:40px 16px}
.bg-scene{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.aurora{position:absolute;inset:0;opacity:.2;filter:blur(80px);animation:auroraMove 14s ease-in-out infinite alternate;background:linear-gradient(180deg,transparent,rgba(16,185,129,.12) 30%,rgba(59,130,246,.08) 60%,transparent);mask-image:linear-gradient(180deg,transparent,#000 20%,#000 70%,transparent)}
@keyframes auroraMove{0%{transform:translateX(-8%) skewX(-3deg)}100%{transform:translateX(8%) skewX(3deg)}}
.orb{position:absolute;border-radius:50%;filter:blur(120px);animation:orbDrift 22s ease-in-out infinite}
.orb-1{width:600px;height:600px;background:radial-gradient(circle,rgba(16,185,129,.2),transparent 65%);top:-20%;left:-15%}
@keyframes orbDrift{0%,100%{transform:translate(0,0)}50%{transform:translate(60px,-40px)}}
.container{position:relative;z-index:10;max-width:800px;margin:0 auto}
.back-btn{display:inline-flex;align-items:center;gap:6px;margin-bottom:32px;padding:10px 20px;border-radius:12px;font-size:13px;font-weight:600;color:var(--text-muted);cursor:pointer;transition:all .4s cubic-bezier(.16,1,.3,1);border:1px solid transparent;background:none}
.back-btn:hover{color:var(--text-secondary);background:var(--card-bg);border-color:var(--card-border);transform:translateX(-8px)}
.page-header{text-align:center;margin-bottom:48px}
.page-icon{width:72px;height:72px;border-radius:20px;display:inline-flex;align-items:center;justify-content:center;font-size:32px;margin-bottom:18px;background:var(--green-bg);border:1px solid var(--green-border);color:var(--green-light)}
.page-header h1{font-size:clamp(26px,5vw,42px);font-weight:900;letter-spacing:-.03em;line-height:1.1;margin-bottom:8px;background:linear-gradient(135deg,#fff,#34d399);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent}
.page-header p{font-size:14px;color:var(--text-muted)}
.quiz-card{background:linear-gradient(135deg,rgba(4,20,14,.85),rgba(8,38,24,.75));border:1.5px solid var(--green-border);border-radius:20px;padding:28px;margin-bottom:16px;backdrop-filter:blur(16px);position:relative;overflow:hidden;transition:all .4s}
.quiz-card::before{content:'';position:absolute;top:0;left:0;width:4px;height:100%;background:linear-gradient(180deg,var(--green),var(--green-light));border-radius:4px 0 0 4px;opacity:.5}
.quiz-card.correct{border-color:rgba(5,150,105,.5)}.quiz-card.correct::before{opacity:1}
.quiz-card.wrong{border-color:rgba(239,68,68,.4)}.quiz-card.wrong::before{background:linear-gradient(180deg,#ef4444,#f87171);opacity:1}
.q-num{font-size:11px;font-weight:700;color:var(--green-light);text-transform:uppercase;margin-bottom:10px}
.q-text{font-size:15px;font-weight:700;margin-bottom:18px;line-height:1.45}
.q-opts{display:flex;flex-direction:column;gap:8px}
.q-opt{display:flex;align-items:center;gap:12px;padding:14px 18px;border-radius:14px;background:rgba(255,255,255,.03);border:1.5px solid rgba(255,255,255,.06);cursor:pointer;transition:all .35s cubic-bezier(.16,1,.3,1);font-size:14px;font-weight:500;color:var(--text-secondary);text-align:left}
.q-opt:hover:not(.disabled){background:rgba(5,150,105,.06);border-color:rgba(5,150,105,.2);transform:translateX(4px)}
.opt-letter{width:28px;height:28px;border-radius:8px;background:rgba(255,255,255,.05);border:1px solid rgba(255,255,255,.08);display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:800;color:var(--text-muted);flex-shrink:0}
.q-opt.correct-opt{background:rgba(5,150,105,.1);border-color:rgba(5,150,105,.35);color:var(--green-light)}
.q-opt.correct-opt .opt-letter{background:rgba(5,150,105,.2);color:var(--green-light)}
.q-opt.wrong-opt{background:rgba(239,68,68,.08);border-color:rgba(239,68,68,.3);color:#f87171}
.q-opt.wrong-opt .opt-letter{background:rgba(239,68,68,.15);color:#f87171}
.q-opt.disabled{cursor:default;opacity:.5;pointer-events:none}
.q-opt.correct-opt.disabled{opacity:1}
.q-fb{margin-top:14px;padding:12px 16px;border-radius:12px;font-size:13px;font-weight:600;display:none}
.q-fb.show{display:block}
.q-fb.ok{background:rgba(5,150,105,.08);border:1px solid rgba(5,150,105,.15);color:var(--green-light)}
.q-fb.ko{background:rgba(239,68,68,.06);border:1px solid rgba(239,68,68,.12);color:#f87171}
.score-box{background:linear-gradient(135deg,rgba(4,20,14,.95),rgba(8,38,24,.9));border:1.5px solid var(--green-border);border-radius:20px;padding:32px;text-align:center;margin-top:24px;display:none}
.score-box.show{display:block;animation:fadeUp .6s cubic-bezier(.16,1,.3,1) forwards}
.score-num{font-size:56px;font-weight:900;background:linear-gradient(135deg,var(--green-light),var(--green));-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;line-height:1;margin-bottom:8px}
.score-label{font-size:14px;font-weight:600;color:var(--text-muted);margin-bottom:16px}
.score-msg{font-size:15px;font-weight:600;color:var(--text-secondary);margin-bottom:20px}
.restart-btn{display:inline-flex;align-items:center;gap:8px;padding:14px 28px;border-radius:14px;background:linear-gradient(135deg,#047857,#059669,#10b981);border:none;color:#fff;font-size:14px;font-weight:700;cursor:pointer;transition:all .4s cubic-bezier(.16,1,.3,1);box-shadow:0 6px 24px -4px rgba(5,150,105,.45)}
.restart-btn:hover{transform:translateY(-4px) scale(1.05)}
@keyframes fadeUp{from{opacity:0;transform:translateY(24px)}to{opacity:1;transform:translateY(0)}}
@media(max-width:640px){body{padding:20px 12px}.quiz-card{padding:22px}.score-num{font-size:44px}}
</style>
</head>
<body>
<div class="bg-scene"><div class="aurora"></div><div class="orb orb-1"></div></div>
<div class="container">
<button class="back-btn" onclick="history.back()"><iconify-icon icon="solar:arrow-left-linear" width="16"></iconify-icon> Tornar</button>
<div class="page-header">
<div class="page-icon"><iconify-icon icon="solar:gamepad-bold-duotone"></iconify-icon></div>
<h1>Cost Ambiental</h1>
<p>Posa a prova els teus coneixements</p>
</div>
<div id="quiz"></div>
<div class="score-box" id="scoreBox"><div class="score-num" id="scoreNum">0/0</div><div class="score-label">Respostes correctes</div><div class="score-msg" id="scoreMsg"></div><button class="restart-btn" onclick="buildQuiz()">Tornar a intentar</button></div>
</div>
<script>
var questions=[
{q:"Quants litres d'aigua es necessiten per produir 1 kg de carn de vedella?",o:["1.500 litres","5.000 litres","15.000 litres","50.000 litres"],c:2,f:"La vedella és un dels aliments amb major petjada hídrica: uns 15.000 L/kg."},
{q:"Quin percentatge de les emissions globals de gasos d'efecte hivernacre prové de la producció d'aliments?",o:["5%","12%","26%","45%"],c:2,f:"La producció alimentària genera el 26% de les emissions globals."},
{q:"Quin aliment té la petjada de carboni més baixa?",o:["Carn de vedella","Formatge","Pollastre","Lleguminoses"],c:3,f:"Les lleguminoses només emeten 0,9 kg de CO₂ per kg produït."},
{q:"Quin percentatge de la desforestació de l'Amazònia està vinculat a la ramaderia?",o:["20%","40%","60%","80%"],c:3,f:"El 80% de la desforestació amazònica està lligada a pastures o pinso."},
{q:"Quanta part del menjar produït al món es malbarata?",o:["Una quarta part","Un terç","La meitat","Dos terços"],c:1,f:"Un terç de tot el menjar produït al món es malbarata."},
{q:"Quin gas es genera quan el menjar es podreix als abocadors?",o:["Oxigen nitrogen","Diòxid de sofre","Metà","Ozó"],c:2,f:"El menjar podrit allibera metà, un gas 25 vegades més potent que el CO₂."}
];
var score=0,answered=0,letters=["A","B","C","D"];
function buildQuiz(){
  score=0;answered=0;
  document.getElementById("scoreBox").classList.remove("show");
  var c=document.getElementById("quiz");c.innerHTML="";
  questions.forEach(function(q,i){
    var d=document.createElement("div");d.className="quiz-card";d.id="qc-"+i;
    var oh="";
    q.o.forEach(function(o,j){oh+='<div class="q-opt" onclick="ans('+i+","+j+',this)" id="qo-'+i+"-"+j+'"><span class="opt-letter">'+letters[j]+'</span><span>'+o+"</span></div>"});
    d.innerHTML='<div class="q-num">Pregunta '+(i+1)+" de "+questions.length+'</div><div class="q-text">'+q.q+'</div><div class="q-opts">'+oh+'</div><div class="q-fb" id="qf-'+i+'"></div>';
    c.appendChild(d);
  });
}
function ans(qi,oi,el){
  var q=questions[qi],card=document.getElementById("qc-"+qi);
  if(card.classList.contains("correct")||card.classList.contains("wrong"))return;
  answered++;var fb=document.getElementById("qf-"+qi);
  if(oi===q.c){
    score++;card.classList.add("correct");el.classList.add("correct-opt");
    fb.className="q-fb show ok";fb.textContent="✅ Correcte! "+q.f;
  }else{
    card.classList.add("wrong");el.classList.add("wrong-opt");
    document.getElementById("qo-"+qi+"-"+q.c).classList.add("correct-opt");
    fb.className="q-fb show ko";fb.textContent="❌ Incorrecte. "+q.f;
  }
  q.o.forEach(function(_,j){
    var op=document.getElementById("qo-"+qi+"-"+j);
    if(j!==oi&&j!==q.c)op.classList.add("disabled");op.style.pointerEvents="none";
  });
  if(answered===questions.length){
    setTimeout(function(){
      var box=document.getElementById("scoreBox");
      document.getElementById("scoreNum").textContent=score+"/"+questions.length;
      var msg=score===questions.length?"🌟 Perfecte! Ets un expert!":score>=4?"👍 Molt bé!":"Continua aprenent!";
      document.getElementById("scoreMsg").textContent=msg;box.classList.add("show");
      if(score>=4)confetti({particleCount:120,spread:70,origin:{y:.7}});
    },600);
  }
}
buildQuiz();
</script>
</body>
</html>
